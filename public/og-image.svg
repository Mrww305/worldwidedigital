  <circle cx="1050" cy="500" r="1" fill="#e8e8e8" opacity="0.4"/>
  
  <!-- Wireframe icosahedron (right side) -->
  <g transform="translate(900, 315)" opacity="0.15">
    <polygon points="0,-80 69,-40 69,40 0,80 -69,40 -69,-40" fill="none" stroke="#8fd0e0" stroke-width="1.5"/>
    <polygon points="0,-60 52,-30 52,30 0,60 -52,30 -52,-30" fill="none" stroke="#8fd0e0" stroke-width="1"/>
    <line x1="0" y1="-80" x2="0" y2="-60" stroke="#8fd0e0" stroke-width="1"/>
    <line x1="69" y1="-40" x2="52" y2="-30" stroke="#8fd0e0" stroke-width="1"/>
    <line x1="69" y1="40" x2="52" y2="30" stroke="#8fd0e0" stroke-width="1"/>
    <line x1="0" y1="80" x2="0" y2="60" stroke="#8fd0e0" stroke-width="1"/>
    <line x1="-69" y1="40" x2="-52" y2="30" stroke="#8fd0e0" stroke-width="1"/>
    <line x1="-69" y1="-40" x2="-52" y2="-30" stroke="#8fd0e0" stroke-width="1"/>
  </g>
  
  <!-- Neural network dots (right side) -->
  <g opacity="0.25">
    <circle cx="850" cy="250" r="3" fill="#8fd0e0"/>
    <circle cx="920" cy="280" r="2.5" fill="#8fd0e0"/>
    <circle cx="880" cy="350" r="3" fill="#8fd0e0"/>
    <circle cx="950" cy="320" r="2" fill="#8fd0e0"/>
    <circle cx="1000" cy="290" r="2.5" fill="#8fd0e0"/>
    <circle cx="970" cy="380" r="2" fill="#8fd0e0"/>
    <line x1="850" y1="250" x2="920" y2="280" stroke="#8fd0e0" stroke-width="0.5" opacity="0.4"/>
    <line x1="920" y1="280" x2="880" y2="350" stroke="#8fd0e0" stroke-width="0.5" opacity="0.4"/>
    <line x1="880" y1="350" x2="950" y2="320" stroke="#8fd0e0" stroke-width="0.5" opacity="0.4"/>
    <line x1="950" y1="320" x2="1000" y2="290" stroke="#8fd0e0" stroke-width="0.5" opacity="0.4"/>
    <line x1="1000" y1="290" x2="970" y2="380" stroke="#8fd0e0" stroke-width="0.5" opacity="0.4"/>
  </g>
  
  <!-- Main text (left side) -->
  <text x="80" y="280" font-family="Space Grotesk, sans-serif" font-size="72" font-weight="700" fill="#e8e8e8" letter-spacing="-2">
    SAJID AFRIDI
  </text>
  <text x="80" y="330" font-family="JetBrains Mono, monospace" font-size="24" font-weight="400" fill="#8fd0e0" letter-spacing="2">
    mr305
  </text>
  
  <!-- Bottom tags -->
  <text x="80" y="520" font-family="JetBrains Mono, monospace" font-size="14" font-weight="300" fill="#7a7a7a" letter-spacing="1.5">
    AI GOVERNANCE ARCHITECT · MLOPS · ZERO TRUST · PHYSICAL AI
  </text>
  
  <!-- Accent line -->
  <rect x="80" y="360" width="60" height="2" fill="#8fd0e0" opacity="0.7"/>
