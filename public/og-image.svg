<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <!-- Deep space background -->
  <rect width="1200" height="630" fill="#000000"/>
  
  <!-- Subtle star field -->
  <circle cx="150" cy="80" r="1.5" fill="#8fd0e0" opacity="0.6"/>
  <circle cx="320" cy="120" r="1" fill="#e8e8e8" opacity="0.4"/>
  <circle cx="480" cy="60" r="1.2" fill="#8fd0e0" opacity="0.5"/>
  <circle cx="650" cy="140" r="0.8" fill="#e8e8e8" opacity="0.3"/>
  <circle cx="820" cy="90" r="1.3" fill="#8fd0e0" opacity="0.5"/>
  <circle cx="980" cy="110" r="1" fill="#e8e8e8" opacity="0.4"/>
  <circle cx="1100" cy="70" r="1.5" fill="#8fd0e0" opacity="0.6"/>
  <circle cx="200" cy="450" r="1" fill="#e8e8e8" opacity="0.3"/>
  <circle cx="400" cy="520" r="1.2" fill="#8fd0e0" opacity="0.4"/>
  <circle cx="700" cy="480" r="0.8" fill="#e8e8e8" opacity="0.3"/>
